name: 検索収集
on:
  schedule:
    - cron: "0 * * * *"   # 1時間ごと（直近分の常時スイープ）
  workflow_dispatch:
    # 手動実行で公開期間を区切って過去分を取り込む（README「過去動画の一括登録」）。空なら定時と同じ直近12時間。
    inputs:
      after:
        description: "この日以降に公開された動画（YYYY-MM-DD、UTC）。空なら直近12時間"
        required: false
        default: ""
      before:
        description: "この日より前に公開された動画（YYYY-MM-DD、UTC）。after と組み合わせる"
        required: false
        default: ""
      dry_run:
        description: "書き込まず、追加予定の一覧をログに出すだけにする"
        type: boolean
        default: false
permissions:
  contents: write

concurrency:
  group: video-collect        # collect.yml と同じグループにして videos.json への書き込みを直列化する
  cancel-in-progress: false    # 実行中のジョブは待たせて、後から追いつかせる

jobs:
  search:
    runs-on: ubuntu-latest
    env:
      # 入力はスクリプトに直接埋め込まず環境変数で渡す（シェルへの注入を防ぐ。形式は search_collect.py が検査）
      AFTER: ${{ inputs.after }}
      BEFORE: ${{ inputs.before }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - name: 検索収集を実行
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          args=()
          if [ -n "$AFTER" ]; then args+=(--after "$AFTER"); fi
          if [ -n "$BEFORE" ]; then args+=(--before "$BEFORE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/search_collect.py "${args[@]}"
      - name: 差分があればコミット＆プッシュ
        run: |
          if git diff --quiet docs/videos.json; then
            echo "変更なし"
            exit 0
          fi
          added=$(git diff docs/videos.json | grep -c '^+ *"videoId"')
          period=""
          if [ -n "$AFTER" ]; then period="（${AFTER}〜${BEFORE}）"; fi

          # 検索エンジン・AIクローラー向けの静的索引を videos.json から作り直す。
          # （下の rebase リトライ後は作り直していないが、その場合も次回実行で追いつく）
          python scripts/build_static.py

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/videos.json docs/index.html docs/sitemap.xml
          git commit -m "検索収集${period}: 動画${added}件を追加"

          # push失敗時にpull --rebaseしてリトライ
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功"
              break
            fi
            echo "push失敗、rebaseしてリトライ ($i回目)"
            git pull --rebase origin main
            if [ "$i" -eq 5 ]; then
              echo "5回試行しても失敗しました"
              exit 1
            fi
          done
