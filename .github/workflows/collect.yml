name: 動画自動収集

on:
  schedule:
    - cron: "0 */6 * * *"   # 6時間ごと
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 収集を実行
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect.py

      - name: 差分があればコミット＆プッシュ
        run: |
          if git diff --quiet docs/videos.json; then
            echo "変更なし"
            exit 0
          fi
          added=$(git diff docs/videos.json | grep -c '^+ *"videoId"')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/videos.json
          git commit -m "自動収集: 動画${added}件を追加"
          git push
